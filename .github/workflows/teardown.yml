name: HW31 Teardown

on:
  schedule:
    - cron: '0 2 * * *'

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-north-1
  AWS_DEFAULT_REGION: eu-north-1

  BASE_STACK: zona2406-gmail-com-org/rbdrm-hw31-base/dev
  DEMO_STACK: zona2406-gmail-com-org/rbdrm-hw31-demo/dev

  APP_DB_PASSWORD: ci-destroy-only-password

jobs:
  teardown:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Authenticate with Pulumi Cloud
        uses: pulumi/auth-actions@v2
        with:
          organization: zona2406-gmail-com-org
          requested-token-type: urn:pulumi:token-type:access_token:personal
          scope: user:zona2406-gmail-com

      - name: Install Pulumi CLI
        uses: pulumi/actions@v7

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::031650015651:role/nodejs-pro-hw31-github-teardown
          aws-region: eu-north-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Install demo dependencies
        working-directory: infra/demo
        run: npm ci

      - name: Install base dependencies
        working-directory: infra/base
        run: npm ci

      - name: Destroy demo stack
        working-directory: infra/demo
        run: |
          set -euo pipefail

          pulumi stack select "$DEMO_STACK"
          pulumi destroy --yes

      - name: Destroy base except teardown identity
        working-directory: infra/base
        shell: bash
        run: |
          set -euo pipefail

          pulumi stack select "$BASE_STACK"

          STACK_STATE="$(pulumi stack export)"

          ROLE_URN="$(
            echo "$STACK_STATE" |
              jq -r '
                .deployment.resources[]
                | select(.urn | endswith("::github-teardown-role"))
                | .urn
              '
          )"

          POLICY_URN="$(
            echo "$STACK_STATE" |
              jq -r '
                .deployment.resources[]
                | select(.urn | endswith("::github-teardown-policy"))
                | .urn
              '
          )"

          OIDC_URN="$(
            echo "$STACK_STATE" |
              jq -r '
                .deployment.resources[]
                | select(.urn | endswith("::github-actions-oidc"))
                | .urn
              '
          )"

          test -n "$ROLE_URN"
          test -n "$POLICY_URN"
          test -n "$OIDC_URN"

          echo "Preserving teardown identity until verification"

          pulumi destroy --yes \
            --exclude "$ROLE_URN" \
            --exclude "$POLICY_URN" \
            --exclude "$OIDC_URN"

      - name: Remove GitHub OIDC provider before tagged-resource check
        working-directory: infra/base
        shell: bash
        run: |
          set -euo pipefail

          OIDC_ARN="$(
            pulumi stack output githubOidcProviderArn
          )"

          echo "Deleting OIDC provider: $OIDC_ARN"

          aws iam delete-open-id-connect-provider \
            --open-id-connect-provider-arn "$OIDC_ARN"

      - name: Verify AWS teardown
        working-directory: infra/base
        shell: bash
        run: |
          set -euo pipefail

          R="$AWS_REGION"

          TAGGED_REGION="$(
            aws resourcegroupstaggingapi get-resources \
              --region "$R" \
              --tag-filters Key=Project,Values=nodejs-pro-hw31 \
              --query 'length(ResourceTagMappingList)' \
              --output text
          )"

          TAGGED_US_EAST_1="$(
            aws resourcegroupstaggingapi get-resources \
              --region us-east-1 \
              --tag-filters Key=Project,Values=nodejs-pro-hw31 \
              --query 'length(ResourceTagMappingList)' \
              --output text
          )"

          TAGGED_RESOURCES_LEFT=$((TAGGED_REGION + TAGGED_US_EAST_1))

          RDS_LEFT="$(
            aws rds describe-db-instances \
              --region "$R" \
              --query 'length(DBInstances)' \
              --output text
          )"

          ALB_LEFT="$(
            aws elbv2 describe-load-balancers \
              --region "$R" \
              --query 'length(LoadBalancers)' \
              --output text
          )"

          NAT_LEFT="$(
            aws ec2 describe-nat-gateways \
              --region "$R" \
              --filter Name=state,Values=available \
              --query 'length(NatGateways)' \
              --output text
          )"

          EIP_LEFT="$(
            aws ec2 describe-addresses \
              --region "$R" \
              --query 'length(Addresses)' \
              --output text
          )"

          echo "tagged-resources-left=$TAGGED_RESOURCES_LEFT"
          echo "rds-left=$RDS_LEFT"
          echo "alb-left=$ALB_LEFT"
          echo "nat-left=$NAT_LEFT"
          echo "eip-left=$EIP_LEFT"

          test "$TAGGED_RESOURCES_LEFT" -eq 0
          test "$RDS_LEFT" -eq 0
          test "$ALB_LEFT" -eq 0
          test "$NAT_LEFT" -eq 0
          test "$EIP_LEFT" -eq 0

      - name: Destroy remaining teardown identity
        working-directory: infra/base
        shell: bash
        run: |
          set -euo pipefail

          pulumi stack select "$BASE_STACK"
          pulumi destroy --yes

      - name: Verify Pulumi state
        working-directory: infra/base
        shell: bash
        run: |
          set -euo pipefail

          pulumi stack select "$BASE_STACK"

          STATE_RESOURCES_LEFT="$(
            pulumi stack export |
              jq '[
                (.deployment.resources // [])
                | .[]
                | select(.type | startswith("aws:"))
              ] | length'
          )"

          echo "state-resources-left=$STATE_RESOURCES_LEFT"

          test "$STATE_RESOURCES_LEFT" -eq 0
