openapi: 3.0.3

info:
  title: Marketplace API
  version: 1.0.0
  description: API contract for the Marketplace course project.

security: []

servers:
  - url: http://localhost:3000

paths:
  /products:
    post:
      operationId: createProduct
      summary: Create product
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, price]
              properties:
                name: { type: string, minLength: 1 }
                description: { type: string }
                price: { type: integer, minimum: 1 }
                stockQuantity: { type: integer, minimum: 0 }
      responses:
        '201':
          description: Product created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    get:
      operationId: getProducts
      summary: Get products list
      description: Returns a paginated list of marketplace products.
      parameters:
        - in: query
          name: limit
          required: false
          description: Maximum number of products to return.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10

        - in: query
          name: cursor
          required: false
          description: Opaque pagination token returned by the previous request. Clients must not parse or modify it.
          schema:
            type: string

      responses:
        '200':
          description: Products list returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'

        '400':
          $ref: '#/components/responses/BadRequest'

  /products/{id}:
    get:
      operationId: getProductById
      summary: Get product by id
      description: Returns a single marketplace product.
      parameters:
        - in: path
          name: id
          required: true
          description: Product identifier.
          schema:
            type: integer
            minimum: 1

      responses:
        '200':
          description: Product returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'

        '404':
          $ref: '#/components/responses/NotFound'

  /orders:
    get:
      operationId: getOrders
      summary: Get orders list
      description: Returns a paginated list of marketplace orders.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          required: false
          description: Maximum number of orders to return.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10

        - in: query
          name: cursor
          required: false
          description: Opaque pagination token returned by the previous request. Clients must not parse or modify it.
          schema:
            type: string

      responses:
        '200':
          description: Orders list returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'

        '400':
          $ref: '#/components/responses/BadRequest'

    post:
      operationId: createOrder
      summary: Create order
      description: Creates a new marketplace order.
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          description: Repeating a request with the same Idempotency-Key and the same request body must return the same response as the original request.
          schema:
            type: string
            minLength: 1

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'

      responses:
        '201':
          description: Order created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

        '400':
          $ref: '#/components/responses/BadRequest'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '409':
          $ref: '#/components/responses/Conflict'

        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /orders/{id}:
    get:
      operationId: getOrderById
      summary: Get order by id
      description: Returns a single marketplace order.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          description: Order identifier.
          schema:
            type: integer
            minimum: 1

      responses:
        '200':
          description: Order returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      operationId: updateOrderStatus
      summary: Cancel an order
      description: Cancels an order before asynchronous payment processing begins.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status:
                  type: string
                  enum: [cancelled]
      responses:
        '200':
          description: Order cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /payments/webhook:
    post:
      operationId: paymentWebhook
      summary: Simulated payment provider webhook
      description: Finalizes an order using its frozen checkout amount. This endpoint is authenticated by an HMAC signature over the raw JSON body.
      parameters:
        - in: header
          name: X-Payment-Signature
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_id, order_id, amount]
              properties:
                event_id:
                  type: string
                order_id:
                  type: integer
                amount:
                  type: integer
      responses:
        '200':
          description: Payment finalized or already processed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Product:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - price_cents
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Mechanical Keyboard
        price_cents:
          type: integer
          example: 260000

    OrderItem:
      type: object
      additionalProperties: false
      required:
        - product_id
        - quantity
      properties:
        product_id:
          type: integer
          minimum: 1
          example: 1
        quantity:
          type: integer
          minimum: 1
          example: 2

    CreateOrderRequest:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItem'

    Order:
      type: object
      additionalProperties: false
      required:
        - id
        - items
        - total_cents
        - status
      properties:
        id:
          type: integer
          example: 1
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItem'
        total_cents:
          type: integer
          example: 520000
        status:
          type: string
          enum: [created, paid, shipped, completed, cancelled]
          example: created

    ProductListResponse:
      type: object
      additionalProperties: false
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        next_cursor:
          type: string
          nullable: true
          description: Opaque cursor for the next page. Null means there are no more pages.
          example: null

    OrderListResponse:
      type: object
      additionalProperties: false
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        next_cursor:
          type: string
          nullable: true
          description: Opaque cursor for the next page. Null means there are no more pages.
          example: null

    Problem:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - status
        - detail
        - instance
      properties:
        type:
          type: string
          format: uri
          description: URI identifying the problem type.
          example: https://example.com/problems/validation-error

        title:
          type: string
          description: Short human-readable problem title.
          example: Validation error

        status:
          type: integer
          description: HTTP status code.
          example: 400

        detail:
          type: string
          description: Human-readable explanation of what went wrong.
          example: Request validation failed.

        instance:
          type: string
          description: URI identifying this particular occurrence of the problem.
          example: /orders

  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    NotFound:
      description: Resource not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    Unauthorized:
      description: Authentication is required.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    Forbidden:
      description: The authenticated user is not allowed to perform this operation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    Conflict:
      description: The request conflicts with current resource state.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    UnprocessableEntity:
      description: Idempotency key was reused with a different request body.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
