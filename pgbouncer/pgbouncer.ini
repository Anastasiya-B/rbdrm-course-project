[databases]
marketplace = host=postgres port=5432 dbname=marketplace user=marketplace password=marketplace_password

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

admin_users = marketplace
stats_users = marketplace

pool_mode = transaction
default_pool_size = 5
max_client_conn = 200

max_prepared_statements = 200

ignore_startup_parameters = extra_float_digits

server_tls_sslmode = disable