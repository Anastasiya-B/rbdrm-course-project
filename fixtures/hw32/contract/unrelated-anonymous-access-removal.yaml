openapi: 3.0.3

info:
  title: HW32 Contract Gate Fixture
  version: 1.0.1

paths:
  /products:
    get:
      operationId: listProducts
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Product list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, name]
                  properties:
                    id: { type: integer }
                    name: { type: string }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
