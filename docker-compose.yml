services:
  postgres:
    image: postgres:16
    container_name: marketplace-postgres
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace_password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U marketplace -d marketplace']
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: marketplace-pgbouncer
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '6432:6432'
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -h 127.0.0.1 -p 6432 -U marketplace -d marketplace',
        ]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

  pact-broker-db:
    image: postgres:16-alpine
    container_name: marketplace-pact-broker-db
    environment:
      POSTGRES_DB: pact_broker
      POSTGRES_USER: pact_broker
      POSTGRES_PASSWORD: pact_broker_password
    volumes:
      - pact_broker_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pact_broker -d pact_broker']
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

  pact-broker:
    image: pactfoundation/pact-broker:latest
    container_name: marketplace-pact-broker
    depends_on:
      pact-broker-db:
        condition: service_healthy
    ports:
      - '9292:9292'
    environment:
      PACT_BROKER_PORT: '9292'
      PACT_BROKER_DATABASE_URL: postgres://pact_broker:pact_broker_password@pact-broker-db/pact_broker
      PACT_BROKER_DATABASE_CONNECT_MAX_RETRIES: '10'
      PACT_BROKER_LOG_LEVEL: INFO
      PACT_BROKER_BASE_URL: http://127.0.0.1:9292
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'ruby -rnet/http -e "exit(Net::HTTP.get_response(URI(%q{http://127.0.0.1:9292/diagnostic/status/heartbeat})).is_a?(Net::HTTPSuccess) ? 0 : 1)"',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  postgres_data:
  pact_broker_data:
