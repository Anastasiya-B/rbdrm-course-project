name: ${COMPOSE_PROJECT_NAME:-marketplace-course}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U marketplace -d marketplace']
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
  pgbouncer:
    image: edoburu/pgbouncer:latest
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -h 127.0.0.1 -p 6432 -U marketplace -d marketplace',
        ]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
  rabbitmq:
    image: rabbitmq:4.2-management
    user: '0:0'
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: app
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_running']
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s
  pact-broker-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pact_broker
      POSTGRES_USER: pact_broker
      POSTGRES_PASSWORD: pact_broker_password
    volumes:
      - pact_broker_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pact_broker -d pact_broker']
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
  pact-broker:
    image: pactfoundation/pact-broker:latest
    depends_on:
      pact-broker-db:
        condition: service_healthy
    ports:
      - '${PACT_PORT:-23929}:9292'
    environment:
      PACT_BROKER_PORT: '9292'
      PACT_BROKER_DATABASE_URL: postgres://pact_broker:pact_broker_password@pact-broker-db/pact_broker
      PACT_BROKER_DATABASE_CONNECT_MAX_RETRIES: '10'
      PACT_BROKER_LOG_LEVEL: INFO
      PACT_BROKER_BASE_URL: http://127.0.0.1:9292
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'ruby -rnet/http -e "exit(Net::HTTP.get_response(URI(%q{http://127.0.0.1:9292/diagnostic/status/heartbeat})).is_a?(Net::HTTPSuccess) ? 0 : 1)"',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
  redis-cache:
    image: redis:8.4-alpine
    command:
      [
        'redis-server',
        '--maxmemory',
        '64mb',
        '--maxmemory-policy',
        'allkeys-lru',
      ]
    volumes:
      - redis_cache_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 30

  redis-queue:
    image: redis:8.4-alpine
    command:
      [
        'redis-server',
        '--maxmemory-policy',
        'noeviction',
        '--appendonly',
        'yes',
        '--appendfsync',
        'everysec',
      ]
    volumes:
      - redis_queue_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 30
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: hw26user
      MINIO_ROOT_PASSWORD: hw26secretpass
    ports:
      - '${MINIO_API_PORT:-23650}:9000'
      - '${MINIO_CONSOLE_PORT:-23651}:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:9000/minio/health/live']
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s
  db-init:
    build: { context: ., dockerfile: docker/Dockerfile, target: runtime }
    command: ['dist/init.js']
    environment: &base-app-env
      NODE_ENV: production
      PORT: '3000'
      DB_URL: postgresql://marketplace:marketplace_password@postgres:5432/marketplace
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_USER: marketplace
      DB_PASSWORD: marketplace_password
      DB_NAME: marketplace
      BROKER_URL: amqp://app:app@rabbitmq:5672
      REDIS_URL: redis://redis-cache:6379
      REDIS_QUEUE_URL: redis://redis-queue:6379
      PAYMENT_WEBHOOK_SECRET: local-compose-webhook-secret
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:22918}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-1000}
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'
  api:
    build: { context: ., dockerfile: docker/Dockerfile, target: runtime }
    command: ['dist/main.js']
    ports: ['${API_PORT:-3300}:3000']
    environment:
      <<: *base-app-env
      JWT_KID: ${JWT_KID:-}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      REFRESH_TOKEN_PEPPER: ${REFRESH_TOKEN_PEPPER:-}
    depends_on:
      db-init: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
      redis-cache: { condition: service_healthy }
      redis-queue: { condition: service_healthy }
    healthcheck:
      test: ['CMD', '/nodejs/bin/node', '-e', "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
  outbox-relay:
    build: { context: ., dockerfile: docker/Dockerfile, target: runtime }
    command: ['dist/outbox/run-relay.js']
    environment: *base-app-env
    depends_on:
      db-init: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
  payment-worker:
    build: { context: ., dockerfile: docker/Dockerfile, target: runtime }
    command: ['dist/payments/run-workers.js']
    environment: *base-app-env
    depends_on:
      db-init: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
      redis-cache: { condition: service_healthy }
volumes:
  postgres_data:
  rabbitmq_data:
  pact_broker_data:
  redis_cache_data:
  redis_queue_data:
  minio_data:
